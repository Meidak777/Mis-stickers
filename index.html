<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Lab Ultra | Pro Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/gif-frames@1.0.1/dist/gif-frames.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --primary: #5865F2;
            --primary-glow: rgba(88, 101, 242, 0.5);
            --accent: #eb459e;
            --success: #23a559;
            --bg-dark: #0f1012;
            --glass: rgba(30, 31, 34, 0.8);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary-glow);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            box-sizing: border-box;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 24px 24px 0 0;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-weight: 800; font-size: 28px; margin: 0; background: linear-gradient(to right, #fff, #949ba4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: #949ba4; font-size: 14px; margin-top: 8px; }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .drop-zone:hover {
            border-color: var(--primary);
            background: rgba(88, 101, 242, 0.05);
            transform: translateY(-2px);
        }

        .drop-zone svg { width: 48px; height: 48px; fill: var(--primary); margin-bottom: 12px; }

        .input-group { margin-top: 20px; position: relative; }
        input[type="text"] {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            box-sizing: border-box;
        }

        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 15px var(--primary-glow); }
        .btn-primary:hover { transform: scale(1.02); filter: brightness(1.1); }

        .status-box {
            display: none;
            margin-top: 25px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 16px;
        }

        .loader {
            height: 6px;
            width: 100%;
            background: #2b2d31;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            box-shadow: 0 0 10px var(--primary);
            transition: width 0.3s ease;
        }

        .result-card {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid var(--border);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .preview-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .sticker-preview {
            width: 80px; height: 80px;
            background: #000;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sticker-preview img { width: 48px; height: 48px; image-rendering: pixelated; object-fit: contain; }

        .btn-success { background: var(--success); color: #fff; width: 100%; }

        .footer-tag {
            text-align: center;
            font-size: 10px;
            letter-spacing: 2px;
            color: #949ba4;
            margin-top: 30px;
            opacity: 0.5;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="orb"></div>

<div class="container">
    <div class="header">
        <h1>Sticker Lab <span style="color:var(--primary)">Ultra</span></h1>
        <p>Procesa, optimiza y crea stickers de 48x48</p>
    </div>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <div style="font-weight: 600;">Suelte su imagen aquí</div>
        <div style="font-size: 12px; color: #949ba4; margin-top: 5px;">Soporta GIF, PNG, WEBP</div>
        <input type="file" id="fileInput" hidden accept="image/*">
    </div>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="https://ejemplo.com/imagen.png">
        <button class="btn btn-primary" onclick="handleUrl()">PROCESAR DESDE LINK</button>
    </div>

    <div class="status-box" id="statusBox">
        <div id="statusText" style="font-size: 13px; font-weight: 600;">Iniciando motor...</div>
        <div class="loader"><div class="loader-bar" id="progressBar"></div></div>
    </div>

    <div class="result-card" id="resultCard">
        <div class="preview-wrapper">
            <div class="sticker-preview">
                <img id="finalImg" src="" alt="">
            </div>
        </div>
        <input type="text" id="resultUrl" readonly style="margin-bottom: 15px; text-align: center; border-style: dashed;">
        <button class="btn btn-success" id="copyBtn" onclick="copyResult()">COPIAR ENLACE GIF</button>
        <button class="btn" style="background: transparent; color: #949ba4; font-size: 12px;" onclick="location.reload()">PROCESAR OTRO</button>
    </div>

    <div class="footer-tag">AI Powered Processing • v3.0 Ultra</div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const statusBox = document.getElementById('statusBox');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const resultCard = document.getElementById('resultCard');

    fileInput.onchange = e => startProcessing(e.target.files[0]);

    const dz = document.getElementById('dropZone');
    dz.ondragover = e => { e.preventDefault(); dz.style.borderColor = "var(--primary)"; };
    dz.ondragleave = () => { dz.style.borderColor = "var(--border)"; };
    dz.ondrop = e => { e.preventDefault(); startProcessing(e.dataTransfer.files[0]); };

    async function handleUrl() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) return;
        updateUI("Descargando...", 20);
        try {
            const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
            const blob = await res.blob();
            startProcessing(blob);
        } catch (e) { updateUI("Error de descarga", 0, true); }
    }

    function updateUI(msg, percent, error = false) {
        statusBox.style.display = "block";
        statusText.textContent = msg;
        statusText.style.color = error ? "#ff4747" : "#fff";
        progressBar.style.width = percent + "%";
        if(error) progressBar.style.background = "#ff4747";
    }

    async function startProcessing(file) {
        if (!file) return;
        resultCard.style.display = "none";

        // Si es una imagen estática (PNG, JPG, WebP)
        if (file.type !== 'image/gif') {
            updateUI("Procesando imagen estática...", 40);
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    c.width = 48; c.height = 48;
                    const ctx = c.getContext('2d');
                    
                    const tempC = document.createElement('canvas');
                    tempC.width = img.width; tempC.height = img.height;
                    const tempCtx = tempC.getContext('2d');
                    tempCtx.drawImage(img, 0, 0);
                    const data = tempCtx.getImageData(0,0,img.width,img.height).data;
                    
                    let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
                    for(let i=3; i<data.length; i+=4) {
                        if(data[i] > 10) {
                            const x = (i/4) % img.width; const y = Math.floor((i/4) / img.width);
                            minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                            minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                        }
                    }
                    if(minX > maxX) { minX=0; minY=0; maxX=img.width; maxY=img.height; }
                    const w = maxX - minX + 1, h = maxY - minY + 1;

                    const s = Math.min(48/w, 48/h);
                    const nw = w*s, nh = h*s;
                    ctx.clearRect(0,0,48,48);
                    ctx.drawImage(img, minX, minY, w, h, (48-nw)/2, (48-nh)/2, nw, nh);

                    updateUI("Empaquetando GIF...", 80);
                    const gif = new GIF({ workers: 2, quality: 5, width: 48, height: 48, workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js', transparent: 'rgba(0,0,0,0)' });
                    gif.addFrame(c, { delay: 100 });
                    gif.on('finished', blob => uploadFile(blob));
                    gif.render();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            return;
        }

        // Si es un GIF Animado
        updateUI("Extrayendo Frames...", 30);
        try {
            const frames = await gifFrames({ url: URL.createObjectURL(file), frames: 'all', outputType: 'canvas', cumulative: true });
            
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            const canvases = frames.map(f => {
                const c = f.getImage();
                const ctx = c.getContext('2d');
                const data = ctx.getImageData(0,0,c.width,c.height).data;
                for(let i=3; i<data.length; i+=4) {
                    if(data[i] > 20) {
                        const x = (i/4) % c.width; const y = Math.floor((i/4) / c.width);
                        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                    }
                }
                return c;
            });

            if(minX === Infinity) { minX=0; minY=0; maxX=canvases[0].width; maxY=canvases[0].height; }
            const w = (maxX - minX) + 1; const h = (maxY - minY) + 1;

            updateUI("Renderizando 48x48...", 60);

            const processed = canvases.map(c => {
                const out = document.createElement('canvas');
                out.width = 48; out.height = 48;
                const ctx = out.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                const s = Math.min(48/w, 48/h);
                const nw = w*s, nh = h*s;
                ctx.drawImage(c, minX, minY, w, h, (48-nw)/2, (48-nh)/2, nw, nh);
                return out;
            });

            updateUI("Empaquetando GIF...", 80);
            const gif = new GIF({ workers: 4, quality: 5, width: 48, height: 48, workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js', transparent: 'rgba(0,0,0,0)' });
            processed.forEach(c => gif.addFrame(c, {delay: 45, copy: true, disposal: 2}));
            
            gif.on('finished', blob => uploadFile(blob));
            gif.render();

        } catch (e) { updateUI("Error de proceso", 0, true); }
    }

    async function uploadFile(blob) {
        updateUI("Subiendo a la nube...", 95);
        const fd = new FormData();
        fd.append('reqtype', 'fileupload');
        fd.append('time', '72h');
        fd.append('fileToUpload', blob, 'sticker.gif');

        try {
            const res = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', { method: 'POST', body: fd });
            const url = await res.text();
            if(url.includes('http')) {
                updateUI("¡Éxito!", 100);
                setTimeout(() => {
                    statusBox.style.display = "none";
                    resultCard.style.display = "block";
                    document.getElementById('finalImg').src = url;
                    document.getElementById('resultUrl').value = url;
                }, 500);
            }
        } catch (e) { updateUI("Error de subida", 0, true); }
    }

    function copyResult() {
        const input = document.getElementById('resultUrl');
        input.select();
        document.execCommand('copy');
        const btn = document.getElementById('copyBtn');
        btn.textContent = "¡COPIADO!";
        btn.style.background = "#43b581";
        setTimeout(() => { btn.textContent = "COPIAR ENLACE GIF"; btn.style.background = "var(--success)"; }, 2000);
    }
</script>
</body>
</html>
