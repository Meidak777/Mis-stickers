<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Maker 48x48</title>
    <style>
        :root { --primary: #5865F2; --primary-hover: #4752C4; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: var(--card); padding: 28px; border-radius: 16px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        h2 { margin-top: 0; color: var(--primary); font-size: 22px; margin-bottom: 20px; }
        
        .upload-area { border: 2px dashed #444; border-radius: 12px; padding: 20px; margin-bottom: 15px; transition: 0.3s; }
        .upload-area:hover { border-color: var(--primary); }
        
        input[type="file"] { display: none; }
        .upload-btn { background: var(--primary); color: white; padding: 12px 20px; border-radius: 8px; cursor: pointer; display: inline-block; font-weight: bold; width: 100%; box-sizing: border-box; transition: 0.2s; }
        .upload-btn:hover { background: var(--primary-hover); }
        
        .divider { margin: 15px 0; color: #666; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2b2b2b; color: #fff; box-sizing: border-box; text-align: center; margin-bottom: 10px; font-size: 14px; }
        .action-btn { background: #4f545c; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; margin-bottom: 15px; transition: 0.2s; }
        .action-btn:hover { background: #686d73; }
        
        #status { margin: 15px 0; font-size: 14px; color: #aaa; min-height: 20px; }
        
        #result-container { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #333; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        #preview { width: 48px; height: 48px; object-fit: contain; border-radius: 4px; background: #000; padding: 4px; border: 1px solid #444; margin-bottom: 15px; }
        
        .copy-btn { background: #248046; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        .copy-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <h2>Sticker 48x48 GIF</h2>
        
        <div class="upload-area">
            <label class="upload-btn">
                📁 Seleccionar Imagen / GIF
                <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp, image/gif">
            </label>
        </div>

        <div class="divider">ó pega un enlace directo</div>
        
        <input type="text" id="urlInput" placeholder="https://ejemplo.com/imagen.png">
        <button class="action-btn" onclick="procesarUrl()">Procesar desde URL</button>

        <div id="status">Esperando archivo...</div>

        <div id="result-container">
            <img id="preview" src="" alt="Preview">
            <input type="text" id="linkResult" readonly>
            <button class="copy-btn" id="btnCopiar" onclick="copiarLink()">Copiar Enlace GIF</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gifshot@0.3.2/build/gifshot.min.js"></script>

    <script>
        const fileInput = document.getElementById('fileInput');
        const urlInput = document.getElementById('urlInput');
        const status = document.getElementById('status');
        const resultContainer = document.getElementById('result-container');
        const linkResult = document.getElementById('linkResult');
        const preview = document.getElementById('preview');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) procesarArchivo(file);
        });

        async function procesarUrl() {
            const url = urlInput.value.trim();
            if (!url) return updateStatus('Escribe una URL válida', true);
            
            updateStatus('Obteniendo imagen...');
            try {
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
                const res = await fetch(proxyUrl);
                const blob = await res.blob();
                procesarArchivo(blob);
            } catch (err) {
                updateStatus('Error al cargar la URL. Intenta subir el archivo.', true);
            }
        }

        function updateStatus(msg, isError = false) {
            status.textContent = msg;
            status.style.color = isError ? '#ff4747' : '#aaa';
        }

        function procesarArchivo(blob) {
            updateStatus('Procesando transparencia y dimensiones...');
            resultContainer.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = img.width;
                    tempCanvas.height = img.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(img, 0, 0);

                    const imgData = tempCtx.getImageData(0, 0, img.width, img.height);
                    const data = imgData.data;
                    
                    let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
                    let hasAlpha = false;

                    for (let y = 0; y < img.height; y++) {
                        for (let x = 0; x < img.width; x++) {
                            const alpha = data[(y * img.width + x) * 4 + 3];
                            if (alpha > 5) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                                hasAlpha = true;
                            }
                        }
                    }

                    if (!hasAlpha || minX > maxX) {
                        minX = 0; minY = 0; maxX = img.width; maxY = img.height;
                    }

                    const cropWidth = (maxX - minX) + 1;
                    const cropHeight = (maxY - minY) + 1;

                    const canvas48 = document.createElement('canvas');
                    canvas48.width = 48;
                    canvas48.height = 48;
                    const ctx48 = canvas48.getContext('2d');

                    const scale = Math.min(48 / cropWidth, 48 / cropHeight);
                    const w = cropWidth * scale;
                    const h = cropHeight * scale;
                    const xOffset = (48 - w) / 2;
                    const yOffset = (48 - h) / 2;

                    ctx48.clearRect(0, 0, 48, 48);
                    ctx48.drawImage(img, minX, minY, cropWidth, cropHeight, xOffset, yOffset, w, h);

                    const dataUrl = canvas48.toDataURL('image/png');
                    updateStatus('Generando archivo GIF...');

                    gifshot.createGIF({
                        images: [dataUrl],
                        gifWidth: 48,
                        gifHeight: 48,
                        numFrames: 1,
                        transparent: '#000000'
                    }, function(obj) {
                        if (!obj.error) {
                            subirLitterbox(obj.image);
                        } else {
                            updateStatus('Error al crear GIF', true);
                        }
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(blob);
        }

        async function subirLitterbox(dataUri) {
            updateStatus('Subiendo a la nube...');
            
            const byteString = atob(dataUri.split(',')[1]);
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
            const blob = new Blob([ab], { type: 'image/gif' });
            
            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('time', '72h');
            formData.append('fileToUpload', blob, 'sticker.gif');

            try {
                const response = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {
                    method: 'POST',
                    body: formData
                });

                const resultText = await response.text();

                if (response.ok && resultText.startsWith('http')) {
                    preview.src = resultText;
                    linkResult.value = resultText;
                    resultContainer.style.display = 'block';
                    updateStatus('¡Completado con éxito!');
                } else {
                    throw new Error(resultText);
                }
            } catch (err) {
                console.error(err);
                updateStatus('Error de subida (CORS). El GIF se generó localmente.', true);
                preview.src = dataUri;
                linkResult.value = "Error al subir automáticamente";
                resultContainer.style.display = 'block';
            }
        }

        function copiarLink() {
            linkResult.select();
            linkResult.setSelectionRange(0, 99999);
            document.execCommand('copy');
            
            const btn = document.getElementById('btnCopiar');
            const originalText = btn.textContent;
            btn.textContent = '¡Copiado! ✅';
            btn.style.background = '#43b581';
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '#248046';
            }, 2000);
        }
    </script>
</body>
</html>
