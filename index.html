<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STK-48 CORE | Industrial Processor</title>
    <script src="https://cdn.jsdelivr.net/npm/gif-frames@1.0.1/dist/gif-frames.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;900&display=swap');
        :root { --accent: #5865F2; --bg: #0d0e10; --panel: #16171a; --border: #2d2f35; --text: #ffffff; --success: #23a559; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .main-card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); position: relative; box-sizing: border-box; }
        .status-tag { position: absolute; top: -10px; left: 20px; background: var(--accent); color: white; font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 2px 8px; border-radius: 4px; }
        h1 { font-size: 22px; font-weight: 900; margin: 0; letter-spacing: -1px; }
        .desc { color: #8e9297; font-size: 12px; margin-bottom: 25px; }
        .upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 40px 20px; text-align: center; background: rgba(0,0,0,0.2); cursor: pointer; margin-bottom: 20px; box-sizing: border-box; }
        .upload-area:hover { border-color: var(--accent); background: rgba(88,101,242,0.05); }
        .input-field { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-bottom: 10px; outline: none; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 11px; margin-bottom: 8px; transition: 0.2s; box-sizing: border-box; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-success { background: var(--success); color: white; }
        .btn-download { background: #4f545c; color: white; }
        #monitor { display: none; margin-top: 15px; padding: 12px; background: #000; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
        .bar-bg { height: 4px; background: #1a1a1a; margin-top: 8px; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: var(--accent); transition: 0.3s; }
        #result-view { display: none; margin-top: 25px; text-align: center; }
        .preview-circle { width: 64px; height: 64px; background: #000; border: 1px solid var(--border); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .preview-circle img { width: 48px; height: 48px; image-rendering: pixelated; object-fit: contain; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="status-tag">STK-48 CORE v9.0</div>
    <h1>STK-48 MASTER</h1>
    <div class="desc">Eliminación absoluta de rastros en transparencias.</div>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <div style="font-size: 24px;">🛡️</div>
        <div style="font-weight: bold; margin-top: 8px; font-size: 13px;">CARGAR GIF / IMAGEN</div>
        <input type="file" id="fileInput" hidden accept="image/*">
    </div>

    <input type="text" id="urlInput" class="input-field" placeholder="INPUT SOURCE URL...">
    <button class="btn btn-primary" onclick="fromUrl()">INICIAR PURGA DE CAPAS</button>

    <div id="monitor">
        <div id="status-label">IDLE...</div>
        <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
    </div>

    <div id="result-view">
        <div class="preview-circle"><img id="preview-img" src="" alt=""></div>
        
        <button class="btn btn-download" id="dlBtn">💾 GUARDAR STICKER (LOCAL)</button>
        <div style="margin: 15px 0; border-bottom: 1px solid #333;"></div>
        
        <input type="text" id="final-url" class="input-field" readonly style="text-align: center;" placeholder="Subiendo recurso...">
        <button class="btn btn-success" id="copyBtn" onclick="copyUrl()">COPIAR ENLACE PERMANENTE</button>
        
        <button class="btn" style="background:transparent; color:#555; margin-top:10px; font-size: 10px;" onclick="location.reload()">NUEVO PROCESO</button>
    </div>
</div>

<script>
    const IMGBB_KEY = '5e0002c33f0bc8cfb533401d4e95999a'; 

    let workerUrl = null;

    async function init() {
        try {
            const r = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
            workerUrl = URL.createObjectURL(await r.blob());
        } catch(e) { console.error("Worker load failed"); }
    }
    init();

    document.getElementById('fileInput').onchange = e => process(e.target.files[0]);

    async function fromUrl() {
        const url = document.getElementById('urlInput').value.trim();
        if(!url) return;
        updateUI("BAJANDO SOURCE...", 20);
        try {
            const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
            const blob = await res.blob();
            process(blob);
        } catch(e) { updateUI("ERROR LINK", 0); }
    }

    function updateUI(msg, pct) {
        document.getElementById('monitor').style.display = "block";
        document.getElementById('status-label').textContent = "ESTADO: " + msg;
        document.getElementById('bar').style.width = pct + "%";
    }

    async function process(file) {
        if(!file) return;
        document.getElementById('result-view').style.display = "none";
        updateUI("EXTRAYENDO METADATOS...", 35);

        try {
            const frames = await gifFrames({ url: URL.createObjectURL(file), frames: 'all', outputType: 'canvas', cumulative: true });
            
            let x1=Infinity, y1=Infinity, x2=-Infinity, y2=-Infinity;
            const analyzedData = frames.map(f => {
                const c = f.getImage();
                const d = c.getContext('2d').getImageData(0,0,c.width,c.height).data;
                for(let i=3; i<d.length; i+=4) {
                    if(d[i]>50) {
                        const x=(i/4)%c.width, y=Math.floor((i/4)/c.width);
                        x1=Math.min(x1,x); x2=Math.max(x2,x);
                        y1=Math.min(y1,y); y2=Math.max(y2,y);
                    }
                }
                return { canvas: c, delay: (f.frameInfo.delay * 10) || 50 }; 
            });

            if(x1===Infinity){ x1=0; y1=0; x2=analyzedData[0].canvas.width; y2=analyzedData[0].canvas.height; }
            const w=x2-x1+1, h=y2-y1+1;

            updateUI("PURGANDO PIXELES FANTASMA...", 60);

            const processedFrames = analyzedData.map(item => {
                const out = document.createElement('canvas');
                out.width=48; out.height=48;
                const ctx = out.getContext('2d');
                
                ctx.clearRect(0,0,48,48);
                
                const sc = Math.min(48/w, 48/h);
                const nw=w*sc, nh=h*sc;
                
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(item.canvas, x1, y1, w, h, (48-nw)/2, (48-nh)/2, nw, nh);

                const imgData = ctx.getImageData(0,0,48,48);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i + 3] < 128) {
                        data[i + 3] = 0;
                    } else {
                        data[i + 3] = 255;
                    }
                }
                ctx.putImageData(imgData, 0, 0);

                return { canvas: out, delay: item.delay };
            });

            updateUI("CODIFICANDO MASTER GIF...", 85);
            const gif = new GIF({ 
                workers: 2, 
                quality: 1, 
                width: 48, 
                height: 48, 
                workerScript: workerUrl, 
                transparent: 'rgba(0,0,0,0)',
                repeat: 0 
            });
            
            processedFrames.forEach(f => {
                gif.addFrame(f.canvas, { delay: f.delay, copy: true, disposal: 2 });
            });
            
            gif.on('finished', b => showResult(b));
            gif.render();
        } catch(e) { updateUI("ERROR_SISTEMA", 0); console.error(e); }
    }

    function showResult(blob) {
        updateUI("SISTEMA LISTO", 100);
        setTimeout(() => {
            document.getElementById('monitor').style.display = "none";
            document.getElementById('result-view').style.display = "block";
            const url = URL.createObjectURL(blob);
            document.getElementById('preview-img').src = url;
            
            document.getElementById('dlBtn').onclick = () => {
                const a = document.createElement('a');
                a.href = url;
                a.download = `stk48_clean_${Date.now()}.gif`;
                a.click();
            };

            uploadToImgBB(blob);
        }, 400);
    }

    async function uploadToImgBB(blob) {
        const fd = new FormData();
        fd.append('image', blob);
        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: fd });
            const data = await res.json();
            if(data.success) {
                document.getElementById('final-url').value = data.data.url;
            }
        } catch (e) { document.getElementById('final-url').value = "Error en enlace."; }
    }

    function copyUrl() {
        const i = document.getElementById('final-url');
        if(!i.value.includes('http')) return;
        i.select();
        document.execCommand('copy');
        alert("Enlace copiado.");
    }
</script>
</body>
</html>
