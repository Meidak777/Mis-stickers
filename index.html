<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STK-48 CORE</title>
    <script src="https://cdn.jsdelivr.net/npm/gif-frames@1.0.1/dist/gif-frames.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;900&display=swap');

        :root {
            --accent: #5865F2;
            --bg: #0d0e10;
            --panel: #16171a;
            --border: #2d2f35;
            --text: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .terminal {
            width: 100%;
            max-width: 420px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            position: relative;
            box-sizing: border-box;
        }

        .terminal::before {
            content: "FRAME_DISPOSAL_ACTIVE";
            position: absolute;
            top: -12px; left: 20px;
            background: var(--bg);
            padding: 0 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--accent);
        }

        h1 { font-size: 22px; font-weight: 900; margin: 0 0 10px 0; letter-spacing: -1px; }
        p { color: #8e9297; font-size: 13px; margin-bottom: 25px; }

        .drop-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            cursor: pointer;
            margin-bottom: 20px;
        }

        .drop-area:hover { border-color: var(--accent); background: rgba(88,101,242,0.05); }

        .input-box {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            margin-bottom: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            box-sizing: border-box;
        }

        .btn-run { background: var(--accent); color: #fff; }

        #status-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #000;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }

        .progress-track {
            height: 4px;
            background: #222;
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: 0.3s; }

        #result {
            display: none;
            margin-top: 25px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .preview-frame {
            width: 60px; height: 60px;
            background: #000;
            border: 1px solid var(--border);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .preview-frame img { width: 48px; height: 48px; image-rendering: pixelated; object-fit: contain; }

        .copy-btn { background: #23a559; color: white; margin-top: 10px; }
    </style>
</head>
<body>

<div class="terminal">
    <h1>STK-48 CORE</h1>
    <p>Conversor de stickers con eliminación de rastro.</p>

    <div class="drop-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
        <div style="font-size: 24px; margin-bottom: 10px;">📦</div>
        <div style="font-weight: bold; font-size: 13px;">SUBIR ARCHIVO</div>
        <input type="file" id="fileInput" hidden accept="image/*">
    </div>

    <input type="text" id="urlInput" class="input-box" placeholder="SOURCE_URL_INPUT...">
    <button class="btn btn-run" onclick="fromUrl()">INICIAR CONVERSIÓN</button>

    <div id="status-box">
        <div id="status-text">INIT...</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div id="result">
        <div class="preview-frame"><img id="final-img" src="" alt=""></div>
        <input type="text" id="final-url" class="input-box" readonly style="text-align: center;">
        <button class="btn copy-btn" onclick="copyUrl()">COPIAR LINK</button>
        <button class="btn" style="background:transparent; color:#555; margin-top:10px;" onclick="location.reload()">REINICIAR</button>
    </div>
</div>

<script>
    let workerBlobUrl = null;

    async function preloadWorker() {
        try {
            const response = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
            const scriptText = await response.text();
            workerBlobUrl = URL.createObjectURL(new Blob([scriptText], { type: 'application/javascript' }));
        } catch (e) { console.error("Error cargando motor."); }
    }
    preloadWorker();

    document.getElementById('fileInput').onchange = e => start(e.target.files[0]);

    async function fromUrl() {
        const url = document.getElementById('urlInput').value.trim();
        if(!url) return;
        updateUI("BAJANDO RECURSO...", 20);
        try {
            const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
            const blob = await res.blob();
            start(blob);
        } catch(e) { updateUI("ERROR_URL", 0); }
    }

    function updateUI(txt, pct) {
        document.getElementById('status-box').style.display = "block";
        document.getElementById('status-text').textContent = txt;
        document.getElementById('progress-fill').style.width = pct + "%";
    }

    async function start(file) {
        if(!file) return;
        document.getElementById('result').style.display = "none";

        // Si es una imagen estática (PNG, JPG, WEBP) procesarla de forma limpia sin gif-frames
        if (file.type !== 'image/gif') {
            updateUI("PROCESANDO_IMAGEN...", 40);
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    c.width = 48; c.height = 48;
                    const ctx = c.getContext('2d');
                    
                    const tempC = document.createElement('canvas');
                    tempC.width = img.width; tempC.height = img.height;
                    const tempCtx = tempC.getContext('2d');
                    tempCtx.drawImage(img, 0, 0);
                    const data = tempCtx.getImageData(0,0,img.width,img.height).data;
                    
                    let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
                    for(let i=3; i<data.length; i+=4) {
                        if(data[i] > 10) {
                            const x = (i/4) % img.width; const y = Math.floor((i/4) / img.width);
                            minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                            minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                        }
                    }
                    if(minX > maxX) { minX=0; minY=0; maxX=img.width; maxY=img.height; }
                    const w = maxX - minX + 1, h = maxY - minY + 1;

                    const s = Math.min(48/w, 48/h);
                    const nw = w*s, nh = h*s;
                    ctx.clearRect(0,0,48,48);
                    ctx.drawImage(img, minX, minY, w, h, (48-nw)/2, (48-nh)/2, nw, nh);

                    updateUI("RE-EMPAQUETANDO...", 80);
                    const gif = new GIF({
                        workers: 2,
                        quality: 1,
                        width: 48,
                        height: 48,
                        workerScript: workerBlobUrl,
                        transparent: 0x000000,
                        background: '#000000'
                    });
                    gif.addFrame(c, { delay: 100 });
                    gif.on('finished', blob => upload(blob));
                    gif.render();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            return;
        }

        // Si es un GIF Animado
        updateUI("DESCOMPONIENDO GIF...", 30);

        try {
            const frames = await gifFrames({ 
                url: URL.createObjectURL(file), 
                frames: 'all', 
                outputType: 'canvas', 
                cumulative: true 
            });

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            const canvases = frames.map(f => {
                const c = f.getImage();
                const d = c.getContext('2d').getImageData(0,0,c.width,c.height).data;
                for(let i=3; i<d.length; i+=4) {
                    if(d[i]>20) {
                        const x = (i/4)%c.width; const y = Math.floor((i/4)/c.width);
                        minX = Math.min(minX,x); maxX = Math.max(maxX,x);
                        minY = Math.min(minY,y); maxY = Math.max(maxY,y);
                    }
                }
                return c;
            });

            if(minX === Infinity) { minX=0; minY=0; maxX=canvases[0].width; maxY=canvases[0].height; }
            const w = (maxX - minX)+1; const h = (maxY - minY)+1;

            updateUI("LIMPIANDO CAPAS...", 60);

            const processed = canvases.map(c => {
                const out = document.createElement('canvas');
                out.width = 48; out.height = 48;
                const ctx = out.getContext('2d');
                
                ctx.clearRect(0, 0, 48, 48);
                
                const s = Math.min(48/w, 48/h);
                const nw = w*s, nh = h*s;
                
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(c, minX, minY, w, h, (48-nw)/2, (48-nh)/2, nw, nh);
                return out;
            });

            updateUI("RE-EMPAQUETANDO...", 80);

            const gif = new GIF({
                workers: 2,
                quality: 1,
                width: 48,
                height: 48,
                workerScript: workerBlobUrl,
                transparent: 0x000000,
                background: '#000000'
            });

            processed.forEach(c => {
                gif.addFrame(c, {
                    delay: 45, 
                    copy: true, 
                    disposal: 2
                });
            });

            gif.on('finished', blob => upload(blob));
            gif.render();

        } catch (e) { updateUI("ERROR_PROCESO", 0); }
    }

    async function upload(blob) {
        updateUI("SUBIENDO...", 95);
        const fd = new FormData();
        fd.append('reqtype', 'fileupload');
        fd.append('time', '72h');
        fd.append('fileToUpload', blob, 'sticker.gif');

        try {
            const res = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', { method: 'POST', body: fd });
            const url = await res.text();
            if(url.includes('http')) {
                updateUI("COMPLETO", 100);
                document.getElementById('status-box').style.display = "none";
                document.getElementById('result').style.display = "block";
                document.getElementById('final-img').src = url;
                document.getElementById('final-url').value = url;
            }
        } catch (e) { updateUI("ERROR_UPLOAD", 0); }
    }

    function copyUrl() {
        const i = document.getElementById('final-url');
        i.select();
        document.execCommand('copy');
        alert("Copiado.");
    }
</script>
</body>
</html>
