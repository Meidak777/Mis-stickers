<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Maker Pro 48x48</title>
    <style>
        :root { --primary: #5865F2; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: var(--card); padding: 24px; border-radius: 16px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4); border: 1px solid #333; }
        h2 { margin: 0 0 20px 0; color: var(--primary); font-size: 20px; }
        .upload-btn { background: var(--primary); color: white; padding: 14px; border-radius: 10px; cursor: pointer; display: block; font-weight: bold; margin-bottom: 15px; transition: 0.2s; }
        .upload-btn:hover { background: #4752C4; }
        input[type="file"] { display: none; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2b2b2b; color: #fff; box-sizing: border-box; margin-bottom: 10px; font-size: 14px; text-align: center; }
        .action-btn { background: #4f545c; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 20px; }
        #status { font-size: 13px; color: #aaa; margin-bottom: 15px; min-height: 1.2em; }
        #result-container { display: none; border-top: 1px solid #333; padding-top: 20px; }
        #preview { width: 48px; height: 48px; background: #000; border: 1px solid #444; border-radius: 4px; margin-bottom: 15px; object-fit: contain; }
        .copy-btn { background: #248046; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .copy-btn:active { transform: scale(0.98); }
        progress { width: 100%; height: 8px; border-radius: 4px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Sticker 48x48 (Animado)</h2>
        
        <label class="upload-btn">
            📁 Seleccionar Imagen o GIF
            <input type="file" id="fileInput" accept="image/*">
        </label>

        <input type="text" id="urlInput" placeholder="Pegar link de imagen...">
        <button class="action-btn" onclick="procesarUrl()">Procesar Link</button>

        <div id="status">Esperando archivo...</div>
        <progress id="progress" max="100" value="0"></progress>

        <div id="result-container">
            <img id="preview" src="" alt="Preview">
            <input type="text" id="linkResult" readonly>
            <button class="copy-btn" id="btnCopiar" onclick="copiarLink()">Copiar Link para Discord</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gifshot@0.3.2/build/gifshot.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif-frames@1.0.1/dist/gif-frames.min.js"></script>

    <script>
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const resultContainer = document.getElementById('result-container');
        const linkResult = document.getElementById('linkResult');
        const preview = document.getElementById('preview');

        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) analizarTipo(e.target.files[0]);
        });

        async function procesarUrl() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            status.textContent = "Descargando...";
            try {
                const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
                const blob = await res.blob();
                analizarTipo(blob);
            } catch (e) { status.textContent = "Error al bajar la URL."; }
        }

        function analizarTipo(blob) {
            resultContainer.style.display = 'none';
            if (blob.type === 'image/gif') {
                procesarGIF(blob);
            } else {
                procesarEstatica(blob);
            }
        }

        // PROCESAR IMAGEN ESTÁTICA (PNG/JPG/WEBP)
        function procesarEstatica(blob) {
            status.textContent = "Procesando imagen...";
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const finalCanvas = redimensionarYCentrar(img);
                    const dataUrl = finalCanvas.toDataURL('image/png');
                    crearGIFFinal([dataUrl]);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(blob);
        }

        // PROCESAR GIF ANIMADO (FRAME POR FRAME)
        async function procesarGIF(blob) {
            status.textContent = "Extrayendo frames...";
            progress.style.display = 'block';
            progress.value = 10;

            try {
                const frames = await gifFrames({ url: URL.createObjectURL(blob), frames: 'all', outputType: 'canvas' });
                const processedFrames = [];
                
                for (let i = 0; i < frames.length; i++) {
                    const frameCanvas = frames[i].getImage();
                    const finalCanvas = redimensionarYCentrar(frameCanvas);
                    processedFrames.push(finalCanvas.toDataURL('image/png'));
                    progress.value = 10 + ((i / frames.length) * 40);
                }
                
                status.textContent = "Re-ensamblando GIF...";
                crearGIFFinal(processedFrames);
            } catch (e) {
                status.textContent = "Error procesando GIF animado.";
                console.error(e);
            }
        }

        function redimensionarYCentrar(source) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = source.width;
            tempCanvas.height = source.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(source, 0, 0);
            
            const pixels = tempCtx.getImageData(0,0,source.width,source.height);
            let minX = source.width, minY = source.height, maxX = 0, maxY = 0;
            
            for (let i = 3; i < pixels.data.length; i += 4) {
                if (pixels.data[i] > 10) {
                    const x = (i/4) % source.width;
                    const y = Math.floor((i/4) / source.width);
                    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                }
            }

            const w = (maxX - minX) || source.width;
            const h = (maxY - minY) || source.height;

            const out = document.createElement('canvas');
            out.width = 48; out.height = 48;
            const ctx = out.getContext('2d');
            
            const ratio = Math.min(48 / w, 48 / h);
            const nw = w * ratio, nh = h * ratio;
            const nx = (48 - nw) / 2, ny = (48 - nh) / 2;

            ctx.drawImage(source, minX, minY, w, h, nx, ny, nw, nh);
            return out;
        }

        function crearGIFFinal(frameDataUrls) {
            gifshot.createGIF({
                images: frameDataUrls,
                gifWidth: 48,
                gifHeight: 48,
                interval: 0.05,
                numFrames: frameDataUrls.length,
                sampleInterval: 10,
                repeat: 0
            }, function(obj) {
                if (!obj.error) {
                    subirLitterbox(obj.image);
                }
            });
        }

        async function subirLitterbox(dataUri) {
            status.textContent = "Subiendo a la nube...";
            progress.value = 80;

            const blob = await (await fetch(dataUri)).blob();
            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('time', '72h');
            formData.append('fileToUpload', blob, 'sticker.gif');

            try {
                const res = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {
                    method: 'POST',
                    body: formData
                });
                const url = await res.text();
                if (url.includes('http')) {
                    status.textContent = "¡Listo!";
                    preview.src = url;
                    linkResult.value = url;
                    resultContainer.style.display = 'block';
                    progress.style.display = 'none';
                }
            } catch (e) { status.textContent = "Error de subida."; }
        }

        function copiarLink() {
            linkResult.select();
            document.execCommand('copy');
            const btn = document.getElementById('btnCopiar');
            const originalText = btn.textContent;
            btn.textContent = '¡Copiado! ✅';
            btn.style.background = '#43b581';
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '#248046';
            }, 2000);
        }
    </script>
</body>
</html>
