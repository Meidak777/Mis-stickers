<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STK-48 MASTER</title>
    <script src="https://cdn.jsdelivr.net/npm/gif-frames@1.0.1/dist/gif-frames.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;900&display=swap');
        :root { --accent: #5865F2; --bg: #0d0e10; --panel: #16171a; --border: #2d2f35; --text: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; box-sizing: border-box; }
        .card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); text-align: center; box-sizing: border-box; }
        h1 { font-size: 22px; margin: 0 0 20px; letter-spacing: -1px; }
        .upload-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 40px 20px; cursor: pointer; margin-bottom: 20px; background: rgba(0,0,0,0.2); }
        .upload-zone:hover { border-color: var(--accent); }
        .btn { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 12px; background: var(--accent); color: white; box-sizing: border-box; }
        #monitor { display: none; margin-top: 15px; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-align: left; background: #000; padding: 10px; border-radius: 8px; }
        .progress-bar { height: 4px; background: var(--accent); width: 0%; margin-top: 8px; transition: 0.3s; }
        #result { display: none; margin-top: 20px; }
        .preview { width: 60px; height: 60px; background: #000; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--border); }
        .preview img { width: 48px; height: 48px; image-rendering: pixelated; object-fit: contain; }
    </style>
</head>
<body>

<div class="card">
    <h1>STK-48 MASTER</h1>
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <div style="font-size: 30px;">🖼️</div>
        <b>CARGAR IMAGEN / GIF</b>
        <input type="file" id="fileInput" hidden accept="image/*">
    </div>

    <div id="monitor">
        <div id="status">ESTADO: ESPERANDO</div>
        <div style="background:#222; height:4px; margin-top:8px;"><div class="progress-bar" id="bar"></div></div>
    </div>

    <div id="result">
        <div class="preview"><img id="final-gif" src="" alt=""></div>
        <button class="btn" onclick="downloadGif()">DESCARGAR STICKER 48x48</button>
        <p style="font-size: 10px; color: #555; margin-top: 10px;">Tamaño real: 48x48 píxeles</p>
    </div>
</div>

<script>
    let workerBlobUrl = null;
    let currentBlob = null;

    async function setupEngine() {
        try {
            const r = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
            workerBlobUrl = URL.createObjectURL(await r.blob());
        } catch(e) { console.error("Worker load error"); }
    }
    setupEngine();

    document.getElementById('fileInput').onchange = e => process(e.target.files[0]);

    function updateUI(msg, pct) {
        document.getElementById('monitor').style.display = "block";
        document.getElementById('status').textContent = "ESTADO: " + msg;
        document.getElementById('bar').style.width = pct + "%";
    }

    async function process(file) {
        if (!file) return;
        document.getElementById('result').style.display = "none";

        // Si es una imagen estática (PNG, JPG, WEBP)
        if (file.type !== 'image/gif') {
            updateUI("PROCESANDO IMAGEN...", 40);
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    c.width = 48; c.height = 48;
                    const ctx = c.getContext('2d');
                    
                    const tempC = document.createElement('canvas');
                    tempC.width = img.width; tempC.height = img.height;
                    const tempCtx = tempC.getContext('2d');
                    tempCtx.drawImage(img, 0, 0);
                    const data = tempCtx.getImageData(0,0,img.width,img.height).data;
                    
                    let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
                    for(let i=3; i<data.length; i+=4) {
                        if(data[i] > 10) {
                            const x = (i/4) % img.width; const y = Math.floor((i/4) / img.width);
                            minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                            minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                        }
                    }
                    if(minX > maxX) { minX=0; minY=0; maxX=img.width; maxY=img.height; }
                    const w = maxX - minX + 1, h = maxY - minY + 1;

                    const s = Math.min(48/w, 48/h);
                    const nw = w*s, nh = h*s;
                    ctx.clearRect(0,0,48,48);
                    ctx.drawImage(img, minX, minY, w, h, (48-nw)/2, (48-nh)/2, nw, nh);

                    updateUI("GENERANDO GIF...", 85);
                    const gif = new GIF({
                        workers: 2,
                        quality: 1,
                        width: 48,
                        height: 48,
                        workerScript: workerBlobUrl,
                        transparent: 'rgba(0,0,0,0)'
                    });
                    gif.addFrame(c, { delay: 100 });
                    gif.on('finished', blob => {
                        currentBlob = blob;
                        updateUI("SISTEMA OK", 100);
                        document.getElementById('monitor').style.display = "none";
                        document.getElementById('result').style.display = "block";
                        document.getElementById('final-gif').src = URL.createObjectURL(blob);
                    });
                    gif.render();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            return;
        }

        // Si es GIF Animado
        updateUI("EXTRAYENDO FOTOGRAMAS...", 30);

        try {
            const frames = await gifFrames({ 
                url: URL.createObjectURL(file), 
                frames: 'all', 
                outputType: 'canvas', 
                cumulative: true 
            });

            let x1=Infinity, y1=Infinity, x2=-Infinity, y2=-Infinity;
            const tempCanvases = frames.map(f => {
                const c = f.getImage();
                const d = c.getContext('2d').getImageData(0,0,c.width,c.height).data;
                for(let i=3; i<d.length; i+=4) {
                    if(d[i]>15) {
                        const x=(i/4)%c.width, y=Math.floor((i/4)/c.width);
                        x1=Math.min(x1,x); x2=Math.max(x2,x);
                        y1=Math.min(y1,y); y2=Math.max(y2,y);
                    }
                }
                return c;
            });

            if(x1===Infinity){ x1=0; y1=0; x2=tempCanvases[0].width; y2=tempCanvases[0].height; }
            const w=x2-x1+1, h=y2-y1+1;

            updateUI("LIMPIANDO ESTELA FANTASMA...", 60);

            const processed = tempCanvases.map(c => {
                const o = document.createElement('canvas');
                o.width = 48; o.height = 48;
                const ctx = o.getContext('2d');
                
                ctx.clearRect(0, 0, 48, 48);
                
                const s = Math.min(48/w, 48/h);
                const nw = w*s, nh = h*s;
                
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(c, x1, y1, w, h, (48-nw)/2, (48-nh)/2, nw, nh);
                return o;
            });

            updateUI("RE-CODIFICANDO GIF...", 85);

            const gif = new GIF({
                workers: 2,
                quality: 1,
                width: 48,
                height: 48,
                workerScript: workerBlobUrl,
                transparent: 'rgba(0,0,0,0)'
            });

            processed.forEach(canvas => {
                gif.addFrame(canvas, {
                    delay: 45, 
                    copy: true, 
                    disposal: 2
                });
            });

            gif.on('finished', blob => {
                currentBlob = blob;
                updateUI("SISTEMA OK", 100);
                document.getElementById('monitor').style.display = "none";
                document.getElementById('result').style.display = "block";
                document.getElementById('final-gif').src = URL.createObjectURL(blob);
            });

            gif.render();

        } catch (e) { updateUI("ERROR CRÍTICO", 0); }
    }

    function downloadGif() {
        if(!currentBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(currentBlob);
        a.download = "sticker_48x48.gif";
        a.click();
    }
</script>
</body>
</html>
