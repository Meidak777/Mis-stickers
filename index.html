<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Lab 48x48 | Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/gif-frames@1.0.1/dist/gif-frames.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <style>
        :root {
            --d-blurple: #5865F2;
            --d-green: #23a559;
            --d-dark: #1e1f22;
            --d-darker: #111214;
            --d-card: #2b2d31;
            --d-text: #dbdee1;
            --d-subtext: #949ba4;
        }

        body {
            font-family: 'gg sans', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--d-darker);
            color: var(--d-text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            background: var(--d-card);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            box-sizing: border-box;
        }

        h1 { font-size: 24px; margin-bottom: 8px; color: #fff; }
        p { color: var(--d-subtext); font-size: 14px; margin-bottom: 24px; }

        .drop-zone {
            border: 2px dashed #4e5058;
            border-radius: 12px;
            padding: 40px 20px;
            transition: 0.3s;
            cursor: pointer;
            background: rgba(0,0,0,0.1);
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--d-blurple);
            background: rgba(88, 101, 242, 0.05);
        }

        .btn-primary {
            background: var(--d-blurple);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .btn-primary:hover { background: #4752c4; }

        input[type="text"] {
            width: 100%;
            background: var(--d-darker);
            border: 1px solid #1e1f22;
            padding: 12px;
            border-radius: 4px;
            color: #fff;
            margin: 16px 0;
            box-sizing: border-box;
        }

        .status-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            background: var(--d-darker);
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #progress-fill {
            background: var(--d-blurple);
            height: 100%;
            width: 0%;
            transition: 0.3s;
        }

        .preview-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .preview-box {
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIElEQVQYV2Nk+M/AwMDEwMDIEMDAyMAAF0AzAIEAF0AzAIEAMh0EAC3fByoAAAAASUVORK5CYII=');
            border-radius: 8px;
            padding: 10px;
            border: 2px solid #1e1f22;
        }

        #preview-img { width: 48px; height: 48px; display: block; image-rendering: pixelated; }

        .result-area {
            display: none;
            margin-top: 24px;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .copy-group { display: flex; gap: 8px; margin-top: 10px; }
        
        .btn-success {
            background: var(--d-green);
            flex-grow: 1;
            color: white; border: none; padding: 12px; border-radius: 4px; font-weight: 600; cursor: pointer;
        }

        .tag {
            font-size: 10px;
            text-transform: uppercase;
            background: var(--d-blurple);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="tag">Pro Edition</div>
    <h1>Sticker Maker</h1>
    <p>Convierte cualquier imagen o GIF en un sticker perfecto de 48x48 para Discord.</p>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <span id="dropText">Suelta tu imagen o GIF aquí</span>
        <input type="file" id="fileInput" hidden accept="image/*">
    </div>

    <input type="text" id="urlInput" placeholder="O pega un enlace directo aquí...">
    <button class="btn-primary" onclick="handleUrl()">Procesar desde Enlace</button>

    <div class="status-container" id="statusContainer">
        <div id="statusLabel" style="font-size: 13px; margin-bottom: 8px;">Iniciando...</div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div class="result-area" id="resultArea">
        <div class="preview-group">
            <div class="preview-box">
                <img id="preview-img" src="" alt="Preview">
            </div>
            <div style="text-align: left;">
                <div style="font-weight: bold; font-size: 14px;">Vista previa</div>
                <div style="font-size: 12px; color: var(--d-subtext);">48x48 píxeles</div>
            </div>
        </div>
        
        <input type="text" id="finalUrl" readonly>
        
        <div class="copy-group">
            <button class="btn-success" id="btnCopy" onclick="copyToClipboard()">COPIAR LINK</button>
            <button class="btn-primary" style="width: auto;" onclick="location.reload()">🔄</button>
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const statusContainer = document.getElementById('statusContainer');
    const progressFill = document.getElementById('progress-fill');
    const statusLabel = document.getElementById('statusLabel');
    const resultArea = document.getElementById('result-area');

    fileInput.onchange = e => processFile(e.target.files[0]);

    dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('drag-over'); };
    dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
    dropZone.ondrop = e => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        processFile(e.dataTransfer.files[0]);
    };

    async function handleUrl() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) return;
        updateStatus("Descargando imagen...", 10);
        try {
            const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
            const blob = await res.blob();
            processFile(blob);
        } catch (err) {
            updateStatus("Error al bajar la URL. Prueba subiendo el archivo.", 0, true);
        }
    }

    function updateStatus(text, percent, isError = false) {
        statusContainer.style.display = 'block';
        statusLabel.textContent = text;
        statusLabel.style.color = isError ? '#f23f43' : '#dbdee1';
        progressFill.style.width = percent + '%';
    }

    async function processFile(file) {
        if (!file) return;
        resultArea.style.display = 'none';

        // Si es una imagen estática (PNG, JPG, WebP no GIF)
        if (file.type !== 'image/gif') {
            updateStatus("Procesando imagen estática...", 40);
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 48; canvas.height = 48;
                    const ctx = canvas.getContext('2d');
                    
                    // Recorte Bounding Box básico
                    const tempC = document.createElement('canvas');
                    tempC.width = img.width; tempC.height = img.height;
                    const tempCtx = tempC.getContext('2d');
                    tempCtx.drawImage(img, 0, 0);
                    const imgData = tempCtx.getImageData(0,0,img.width,img.height);
                    let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
                    for (let i = 3; i < imgData.data.length; i += 4) {
                        if (imgData.data[i] > 10) {
                            const x = (i/4) % img.width;
                            const y = Math.floor((i/4) / img.width);
                            minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                            minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                        }
                    }
                    if (minX > maxX) { minX = 0; minY = 0; maxX = img.width; maxY = img.height; }
                    const w = maxX - minX + 1, h = maxY - minY + 1;

                    const ratio = Math.min(48 / w, 48 / h);
                    const nw = w * ratio, nh = h * ratio;
                    const nx = (48 - nw) / 2, ny = (48 - nh) / 2;

                    ctx.clearRect(0,0,48,48);
                    ctx.drawImage(img, minX, minY, w, h, nx, ny, nw, nh);

                    // Convertir a GIF de 1 frame usando gif.js
                    const gif = new GIF({
                        workers: 2, quality: 2, width: 48, height: 48,
                        workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
                    });
                    gif.addFrame(canvas, { delay: 100 });
                    gif.on('finished', blob => uploadToLitterbox(blob));
                    gif.render();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            return;
        }

        // Si es un GIF Animado
        try {
            updateStatus("Extrayendo frames del GIF...", 20);
            const frames = await gifFrames({ 
                url: URL.createObjectURL(file), 
                frames: 'all', 
                outputType: 'canvas', 
                cumulative: true 
            });

            updateStatus("Calculando Bounding Box global...", 40);
            let gMinX = Infinity, gMinY = Infinity, gMaxX = -Infinity, gMaxY = -Infinity;

            const analyzedFrames = frames.map(f => {
                const canvas = f.getImage();
                const ctx = canvas.getContext('2d');
                const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
                const data = imgData.data;

                for (let i = 3; i < data.length; i += 4) {
                    if (data[i] > 10) {
                        const x = (i/4) % canvas.width;
                        const y = Math.floor((i/4) / canvas.width);
                        gMinX = Math.min(gMinX, x); gMaxX = Math.max(gMaxX, x);
                        gMinY = Math.min(gMinY, y); gMaxY = Math.max(gMaxY, y);
                    }
                }
                return canvas;
            });

            if (gMinX === Infinity) { gMinX = 0; gMinY = 0; gMaxX = analyzedFrames[0].width; gMaxY = analyzedFrames[0].height; }

            const cropW = (gMaxX - gMinX) + 1;
            const cropH = (gMaxY - gMinY) + 1;

            updateStatus("Renderizando frames a 48x48...", 60);

            const processedCanvases = analyzedFrames.map(canvas => {
                const out = document.createElement('canvas');
                out.width = 48; out.height = 48;
                const ctx = out.getContext('2d');

                const ratio = Math.min(48 / cropW, 48 / cropH);
                const nw = cropW * ratio;
                const nh = cropH * ratio;
                const nx = (48 - nw) / 2;
                const ny = (48 - nh) / 2;

                ctx.clearRect(0,0,48,48);
                ctx.drawImage(canvas, gMinX, gMinY, cropW, cropH, nx, ny, nw, nh);
                return out;
            });

            updateStatus("Codificando GIF...", 80);
            
            const gif = new GIF({
                workers: 2,
                quality: 10,
                width: 48,
                height: 48,
                workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
            });

            processedCanvases.forEach(c => {
                gif.addFrame(c, { delay: 40, copy: true });
            });

            gif.on('finished', blob => {
                uploadToLitterbox(blob);
            });

            gif.render();

        } catch (err) {
            console.error(err);
            updateStatus("Error procesando GIF animado.", 0, true);
        }
    }

    async function uploadToLitterbox(blob) {
        updateStatus("Subiendo a Litterbox...", 90);
        
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('time', '72h');
        formData.append('fileToUpload', blob, 'sticker.gif');

        try {
            const res = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {
                method: 'POST',
                body: formData
            });
            const url = await res.text();

            if (url.startsWith('http')) {
                updateStatus("¡Completado!", 100);
                document.getElementById('preview-img').src = url;
                document.getElementById('finalUrl').value = url;
                resultArea.style.display = 'block';
                statusContainer.style.display = 'none';
            } else {
                throw new Error("Respuesta inválida");
            }
        } catch (err) {
            updateStatus("Error de subida. Intenta de nuevo.", 0, true);
        }
    }

    function copyToClipboard() {
        const input = document.getElementById('finalUrl');
        input.select();
        document.execCommand('copy');
        
        const btn = document.getElementById('btnCopy');
        btn.textContent = "¡COPIADO!";
        btn.style.background = "#3ca374";
        setTimeout(() => {
            btn.textContent = "COPIAR LINK";
            btn.style.background = "var(--d-green)";
        }, 2000);
    }
</script>
</body>
</html>
